<style>
/* Layout: one phone-first column of cards. Counters on top, charts in the middle, reorderable defect list, then the daily journal. */
:root{
  --bg:#f2f4f7; --card:#ffffff; --ink:#1a202c; --mute:#5b6676; --line:#dde2ea; --field:#f2f4f7;
  --in:#3f8a58; --conso:#b27a2a; --rw:#3b68d4; --sc:#c0493e;
  --rw-bg:#e5ebf7; --sc-bg:#f8e3e1; --btn:#1a202c; --btnfg:#ffffff; --focus:#3b68d4;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161c; --card:#1b212a; --ink:#eef1f5; --mute:#9aa6b6; --line:#2d3643; --field:#232b36;
    --in:#5fb37c; --conso:#d19a45; --rw:#7497f2; --sc:#e0695d;
    --rw-bg:#1f2a42; --sc-bg:#3a2321; --btn:#eef1f5; --btnfg:#12161c; --focus:#7497f2; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12161c; --card:#1b212a; --ink:#eef1f5; --mute:#9aa6b6; --line:#2d3643; --field:#232b36;
  --in:#5fb37c; --conso:#d19a45; --rw:#7497f2; --sc:#e0695d;
  --rw-bg:#1f2a42; --sc-bg:#3a2321; --btn:#eef1f5; --btnfg:#12161c; --focus:#7497f2; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  font-family:var(--font); font-size:15px; line-height:1.4; background:var(--bg); color:var(--ink);
  padding-block:12px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.app{max-width:560px;margin:0 auto}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.01em;text-wrap:balance}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);flex:none;direction:ltr}
.seg button{border:0;background:transparent;padding:10px 13px;font-weight:600;min-width:44px}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btnfg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.cap{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:0 0 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two>div{min-width:0}
label.f{display:block;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:6px}
.inp{width:100%;min-height:48px;border:1px solid var(--line);background:var(--field);border-radius:12px;padding:0 12px;font-weight:600}
.blk{margin-bottom:14px}
.blk:last-child{margin-bottom:0}
.bh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.bh b{display:flex;align-items:center;gap:8px;font-size:17px}
.dot{width:14px;height:14px;border-radius:4px;display:inline-block;flex:none}
.pct{font-size:13px;font-weight:600;color:var(--mute)}
.ctr{display:grid;grid-template-columns:48px minmax(0,1fr) 78px 52px;gap:8px;direction:ltr}
.ctr button{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:22px;font-weight:600}
.ctr button.go{border:0;color:#fff}
.ctr input.amt{font-size:18px;font-weight:700;color:var(--ink);padding:0 4px}
.ctr input{min-height:52px;width:100%;min-width:0;text-align:center;font-size:28px;font-weight:800;border:1px solid var(--line);background:var(--field);border-radius:12px;font-variant-numeric:tabular-nums}
.go.in{background:var(--in)} .go.conso{background:var(--conso)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.tile{border-radius:14px;padding:12px 14px}
.tile.rw{background:var(--rw-bg)} .tile.sc{background:var(--sc-bg)}
.tile b{display:flex;align-items:center;gap:8px;font-size:16px}
.tile .n{font-size:34px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.tile.rw .n{color:var(--rw)} .tile.sc .n{color:var(--sc)}
.fpy{margin:12px 0 0;color:var(--mute);font-size:14px}
.fpy b{color:var(--ink)}
.stepset{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--mute);font-weight:600}
.stepset input{width:84px;min-height:40px;text-align:center;border:1px solid var(--line);background:var(--field);border-radius:10px;font-weight:700}
.chart{direction:ltr}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:var(--font)}
.scrollx{overflow-x:auto;direction:ltr}
.search{margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;font-weight:600;min-height:40px}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btnfg);border-color:var(--btn)}
.row{padding:14px 0;border-top:1px solid var(--line)}
.rh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.code{font-variant-numeric:tabular-nums;font-weight:700;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:14px;flex:none}
.nm{font-weight:600;font-size:16px;min-width:0;flex:1;overflow-wrap:anywhere}
.mv{display:flex;gap:6px;flex:none;direction:ltr}
.mv button{width:44px;height:44px;border:1px solid var(--line);background:var(--card);border-radius:10px;font-weight:700}
.grip{width:52px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;background:var(--field);font-size:22px;line-height:1;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.row.drag{position:relative;z-index:5;background:var(--card);box-shadow:0 10px 28px rgba(0,0,0,.28);border-radius:12px;border-top-color:transparent}
.row.drag .grip{cursor:grabbing;background:var(--line)}
.rb{height:4px;border-radius:2px;margin-bottom:10px;background:var(--line)}
.rb.r{background:var(--rw)} .rb.s{background:var(--sc)}
.rc{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.cg{display:flex;align-items:center;gap:6px;min-width:0;direction:ltr}
.cg .l{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;flex:none;width:0;overflow:visible;white-space:nowrap}
.cg.rw .l{color:var(--rw)} .cg.sc .l{color:var(--sc)}
.cg .st{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.cg .st button{width:44px;height:44px;border-radius:11px;border:1px solid var(--line);background:var(--card);font-size:20px;font-weight:600;flex:none}
.cg .st button.p{border:0;color:#fff}
.cg.rw .p{background:var(--rw)} .cg.sc .p{background:var(--sc)}
.cg .v{flex:1;text-align:center;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;min-width:20px}
.lbls{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:4px}
.lbls span{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.lbls .rw{color:var(--rw)} .lbls .sc{color:var(--sc)}
.empty{padding:20px 0;text-align:center;color:var(--mute)}
.hint{font-size:13px;color:var(--mute);margin:2px 0 4px}
.cg input.v{border:0;background:transparent;padding:0;margin:0;width:100%;min-width:0;color:inherit;border-radius:8px}
.cg input.v:focus{background:var(--field)}
.sm.danger[data-arm="1"]{background:var(--sc);color:#fff;border-color:var(--sc)}
.badge.ok{background:var(--in);color:#fff}
.badge.mini{font-size:11px;padding:2px 9px;margin-inline-start:8px;vertical-align:middle}
.btn.close{background:var(--in);color:#fff;border-color:var(--in)}
.btn.close[data-arm="1"]{background:var(--btn);color:var(--btnfg);border-color:var(--btn)}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;direction:ltr}
.mnav button{width:44px;height:44px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:20px}
.mnav span{font-weight:700;text-transform:capitalize}
.legend{display:flex;gap:16px;margin:2px 0 6px;font-size:13px;color:var(--mute);font-weight:600}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px}
.detail{margin:14px -16px 0;background:var(--field);border-top:1px solid var(--line);padding:14px 16px}
.dh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.dh b{font-size:21px;font-variant-numeric:tabular-nums;flex:1}
.badge{background:var(--btn);color:var(--btnfg);font-size:13px;font-weight:700;border-radius:999px;padding:4px 12px}
.sm{border:1px solid var(--line);background:var(--card);border-radius:10px;min-height:40px;padding:0 14px;font-weight:600}
.kv{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.kv small{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:2px;overflow-wrap:anywhere}
.kv b{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.kv .a{color:var(--in)} .kv .b{color:var(--conso)} .kv .c{color:var(--rw)} .kv .d{color:var(--sc)}
.period{border-top:3px solid var(--ink);margin-top:16px;padding-top:14px}
.period h3{margin:0 0 10px;font-size:19px}
.period h3 span{font-size:14px;font-weight:500;color:var(--mute);margin-inline-start:8px}
.acts{display:grid;gap:10px;margin-top:4px}
.btn{min-height:56px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-size:17px;font-weight:700;width:100%}
.btn.pri{background:var(--btn);color:var(--btnfg);border-color:var(--btn)}
.btn.warn[data-arm="1"]{background:var(--sc);color:#fff;border-color:var(--sc)}
.btn[hidden]{display:none}
.msg{min-height:20px;font-size:13px;color:var(--mute);text-align:center}
@media (max-width:380px){.kv b{font-size:20px}.rc{gap:10px 8px}.cg .st button{width:40px}}
@media (prefers-reduced-motion:no-preference){.chart rect{transition:opacity .15s}}
</style>

<div class="app" id="app">
  <div class="top">
    <h1 data-i="title">Suivi pare-brise</h1>
    <div class="seg" role="group" aria-label="Langue">
      <button type="button" data-lang="ar" aria-pressed="false">عربي</button>
      <button type="button" data-lang="fr" aria-pressed="true">FR</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>

  <section class="card">
    <div class="two">
      <div><label class="f" for="ref" data-i="ref">Référence</label><input class="inp" id="ref" type="text" autocomplete="off"></div>
      <div><label class="f" for="date"><span data-i="date">Date</span><span class="badge mini" id="dayBadge"></span></label><input class="inp" id="date" type="date"></div>
    </div>
  </section>

  <section class="card">
    <div class="blk">
      <div class="bh"><b><span class="dot" style="background:var(--in)"></span><span data-i="entries">Entrées en production</span></b></div>
      <div class="ctr">
        <button type="button" id="inMinus" aria-label="−1">−</button>
        <input id="inVal" type="text" inputmode="numeric" aria-label="Entrées" style="color:var(--in)">
        <input id="inAmt" class="amt" type="text" inputmode="numeric" aria-label="Quantité à ajouter">
        <button type="button" class="go in" id="inPlus" aria-label="Ajouter">+</button>
      </div>
    </div>
    <div class="blk">
      <div class="bh"><b><span class="dot" style="background:var(--conso)"></span><span data-i="conso">Consommation</span></b><span class="pct" id="consoPct"></span></div>
      <div class="ctr">
        <button type="button" id="coMinus" aria-label="−1">−</button>
        <input id="coVal" type="text" inputmode="numeric" aria-label="Consommation" style="color:var(--conso)">
        <input id="coAmt" class="amt" type="text" inputmode="numeric" aria-label="Quantité à ajouter">
        <button type="button" class="go conso" id="coPlus" aria-label="Ajouter">+</button>
      </div>
    </div>
    <div class="tiles">
      <div class="tile rw"><b><span class="dot" style="background:var(--rw)"></span><span data-i="rework">Rework</span></b><div class="n" id="tRw">0</div><div class="pct" id="tRwP"></div></div>
      <div class="tile sc"><b><span class="dot" style="background:var(--sc)"></span><span data-i="scrap">Scrap</span></b><div class="n" id="tSc">0</div><div class="pct" id="tScP"></div></div>
    </div>
    <p class="fpy" id="fpy"></p>
    <div class="stepset"><label for="stepIn" data-i="step">Pas rapide</label><input id="stepIn" type="text" inputmode="numeric"></div>
  </section>

  <section class="card">
    <h2 class="cap" data-i="synth">Synthèse</h2>
    <div class="chart" id="synth"></div>
  </section>

  <section class="card">
    <h2 class="cap" data-i="defects">Défauts</h2>
    <input class="inp search" id="q" type="search" autocomplete="off" data-iph="search">
    <div class="chips" id="chips"></div>
    <div class="hint" data-i="hint"></div>
    <div id="list"></div>
  </section>

  <section class="card">
    <h2 class="cap" data-i="journal">Journal quotidien</h2>
    <div class="mnav"><button type="button" id="mPrev" aria-label="‹">‹</button><span id="mLbl"></span><button type="button" id="mNext" aria-label="›">›</button></div>
    <div class="legend"><span><i style="background:var(--rw)"></i><span data-i="rework">Rework</span></span><span><i style="background:var(--sc)"></i><span data-i="scrap">Scrap</span></span></div>
    <div class="scrollx chart" id="jchart"></div>
    <div id="detail"></div>
    <div class="period" id="period"></div>
  </section>

  <div class="acts">
    <button type="button" class="btn close" id="close">Clôturer la journée</button>
    <button type="button" class="btn pri" id="pdf" hidden data-i="pdf">Exporter en PDF</button>
    <button type="button" class="btn" id="csv" hidden data-i="csv">Exporter en CSV</button>
    <button type="button" class="btn warn" id="reset" data-i="reset">Remettre cette journée à zéro</button>
    <div class="msg" id="msg" role="status"></div>
  </div>
</div>

    list.slice(0,rows).forEach(function(c,i){
      var o=dt[c],y=hy-16-i*13;
      if(i%2===0)rect(M,y-3,Wd,12,RGB.box);
      text(c,M+3,y,7.5,RGB.ink,true);
      text(trunc(NAME[c],236,7.5,false),M+38,y,7.5,RGB.ink);
      text(o.r,M+300,y,7.5,o.r?RGB.rw:RGB.mute,!!o.r,"r");
      text(o.s,M+346,y,7.5,o.s?RGB.sc:RGB.mute,!!o.s,"r");
      text(pct(o.r+o.s,a.i),M+408,y,7.5,RGB.ink,true,"r");
      var w1=bwid*o.r/big,w2=bwid*o.s/big;
      rect(bx,y-1,w1,7,RGB.rw);rect(bx+w1,y-1,w2,7,RGB.sc);
    });
    if(list.length>rows)text("+"+(list.length-rows)+(L==="en"?" more defects":" autres défauts"),M+3,hy-16-rows*13,7.5,RGB.mute);
  }
  text((L==="en"?"Generated on ":"Généré le ")+fmtDay(iso(new Date())),M,28,7,RGB.mute);

  /* assemble the PDF file */
  var objs=[],st=C.join("\n"),i;
  objs[1]="<< /Type /Catalog /Pages 2 0 R >>";
  objs[2]="<< /Type /Pages /Kids [3 0 R] /Count 1 >>";
  objs[3]="<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 5 0 R /F2 6 0 R >> >> /Contents 4 0 R >>";
  objs[4]="<< /Length "+st.length+" >>\nstream\n"+st+"\nendstream";
  objs[5]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>";
  objs[6]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>";
  var out="%PDF-1.4\n",off=[];
  for(i=1;i<objs.length;i++){off[i]=out.length;out+=i+" 0 obj\n"+objs[i]+"\nendobj\n";}
  var xr=out.length;
  out+="xref\n0 "+objs.length+"\n0000000000 65535 f \n";
  for(i=1;i<objs.length;i++)out+=String(off[i]).padStart(10,"0")+" 00000 n \n";
  out+="trailer\n<< /Size "+objs.length+" /Root 1 0 R >>\nstartxref\n"+xr+"\n%%EOF";
  var u=new Uint8Array(out.length);
  for(i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;
  return u;
}
function csvText(){
  var days=monthDays(viewMonth),rows=[["date","entrees","consommation","rework","scrap","scrap_pct"]];
  days.forEach(function(k){var x=tot(S.days[k]);rows.push([k,x.i,x.c,x.r,x.s,pct(x.s,x.i)]);});
  rows.push([]);rows.push(["date","code","defaut","rework","scrap"]);
  days.forEach(function(k){var d=S.days[k].d;S.order.forEach(function(c){if(d[c])rows.push([k,c,'"'+NAME[c].replace(/"/g,'""')+'"',d[c].r||0,d[c].s||0]);});});
  return"﻿"+rows.map(function(r){return r.join(",");}).join("\n");
}
function fallbackSave(name,data){
  var type=/\.pdf$/.test(name)?"application/pdf":"text/csv;charset=utf-8",blob=new Blob([data],{type:type});
  try{
    var file=new File([blob],name,{type:type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file]}).catch(function(){});return;}
  }catch(e){}
  var url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){a.remove();URL.revokeObjectURL(url);},4000);
}
function doSave(name,data){
  if(!downloads){fallbackSave(name,data);return;}
  downloads.save({filename:name,data:data}).then(function(){flash(T().saved);}).catch(function(e){if(e&&e.code==="declined")flash(T().noSave);else flash(String(e&&e.message||e));});
}

/* drag to reorder (touch or mouse) from the ☰ handle */
var drag=null;
function dragUpdate(){
  var row=drag.row;
  row.style.transform="";
  var r=row.getBoundingClientRect(),desiredTop=drag.y-drag.grab,center=desiredTop+r.height/2,g=0;
  while(g++<80){
    var p=row.previousElementSibling,n=row.nextElementSibling;
    if(p){var pr=p.getBoundingClientRect();if(center<pr.top+pr.height/2){row.parentNode.insertBefore(row,p);continue;}}
    if(n){var nr=n.getBoundingClientRect();if(center>nr.top+nr.height/2){row.parentNode.insertBefore(row,n.nextSibling);continue;}}
    break;
  }
  r=row.getBoundingClientRect();
  row.style.transform="translateY("+(desiredTop-r.top)+"px)";
}
function dragLoop(){
  if(!drag)return;
  if(drag.y<110)window.scrollBy(0,-14);else if(drag.y>window.innerHeight-110)window.scrollBy(0,14);
  dragUpdate();
  drag.raf=requestAnimationFrame(dragLoop);
}
function dragEnd(e){
  if(!drag||e.pointerId!==drag.id)return;
  cancelAnimationFrame(drag.raf);
  var row=drag.row;
  row.style.transform="";row.classList.remove("drag");
  drag=null;
  var codes=[].map.call($("#list").querySelectorAll(".row"),function(r){return +r.getAttribute("data-c");});
  var pos=codes.map(function(c){return S.order.indexOf(c);}).sort(function(x,y){return x-y;}),neo=S.order.slice();
  pos.forEach(function(p,i){neo[p]=codes[i];});
  S.order=neo;save();
}
$("#list").addEventListener("pointerdown",function(e){
  var h=e.target.closest(".grip");if(!h||drag)return;
  e.preventDefault();
  var row=h.closest(".row"),r=row.getBoundingClientRect();
  drag={row:row,id:e.pointerId,y:e.clientY,grab:e.clientY-r.top,raf:0};
  row.classList.add("drag");
  try{h.setPointerCapture(e.pointerId);}catch(x){}
  dragLoop();
});
$("#list").addEventListener("pointermove",function(e){if(drag&&e.pointerId===drag.id)drag.y=e.clientY;});
$("#list").addEventListener("pointerup",dragEnd);
$("#list").addEventListener("pointercancel",dragEnd);
$("#list").addEventListener("focusin",function(e){if(e.target.classList&&e.target.classList.contains("v"))e.target.select();});

});

function addDays(k,n){var q=k.split("-");return iso(new Date(+q[0],+q[1]-1,+q[2]+n));}
$("#close").addEventListener("click",function(){
  var cur=S.days[S.date];
  if(!cur||!hasData(cur)){flash(T().nothing);return;}
  if(!closeArm){
    closeArm=true;$("#close").setAttribute("data-arm","1");applyLang();
    clearTimeout(closeTimer);closeTimer=setTimeout(function(){closeArm=false;$("#close").removeAttribute("data-arm");applyLang();},4000);
    return;
  }
  clearTimeout(closeTimer);closeArm=false;$("#close").removeAttribute("data-arm");
  cur.closed=true;
  var done=S.date,today=iso(new Date()),nx=today>done?today:addDays(done,1);
  while(S.days[nx]&&S.days[nx].closed)nx=addDays(nx,1);
  S.date=nx;selDay=done;viewMonth=done.slice(0,7);resetArm=false;delArm=false;
  save();applyLang();render();flash(T().closedMsg);
  window.scrollTo({top:0,behavior:"smooth"});
});
